services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manhua
      POSTGRES_PASSWORD: manhua_pass
      POSTGRES_DB: manhua_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manhua -d manhua_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://manhua:manhua_pass@db:5432/manhua_bot
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp

volumes:
  pgdata:
