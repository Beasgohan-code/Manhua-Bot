[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydlp"
description = "Py-dlp: the complete yt-dlp engine bundled with a pydlp command - a downloader for (almost) any site"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
keywords = [
    "cli",
    "downloader",
    "youtube-dl",
    "youtube-downloader",
    "sponsorblock",
    "yt-dlp",
    "pydlp",
]
classifiers = [
    "Topic :: Multimedia :: Video",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
# version always matches the bundled yt-dlp engine (yt_dlp/version.py)
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Beasgohan-code/Py-dlp"
Upstream = "https://github.com/yt-dlp/yt-dlp"
Tracker = "https://github.com/Beasgohan-code/Py-dlp/issues"

[project.scripts]
pydlp = "pydlp.cli:main"
# the bundled engine is also usable under its own name
yt-dlp = "yt_dlp:main"

[project.entry-points.pyinstaller40]
hook-dirs = "yt_dlp.__pyinstaller:get_hook_dirs"

[project.optional-dependencies]
# Mirrors yt-dlp's optional extras (everything is optional).
default = [
    "brotli ; implementation_name == 'cpython' and sys_platform != 'ios'",
    "brotlicffi ; implementation_name != 'cpython'",
    "certifi",
    "mutagen",
    "pycryptodomex",
    "requests>=2.32.2,<3",
    "urllib3>=2.0.2,<3",
    "websockets>=13.0",
    "yt-dlp-ejs==0.8.0",
]
curl-cffi = ["curl-cffi"]
secretstorage = ["secretstorage"]

[tool.setuptools.packages.find]
include = ["pydlp*", "yt_dlp*"]

[tool.setuptools.dynamic]
version = { attr = "pydlp.__version__" }

[tool.setuptools.package-data]
pydlp = ["py.typed"]
